<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Graph-Lite RAG Agent</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <h1>Graph-Lite RAG Agent</h1>
    <p class="subtitle">Ask a question, or drop in a new file to query it directly.</p>

    <div class="upload-row">
      <label class="upload-btn" for="data-input">
        <span>+ Upload CSV/XLSX</span>
        <input id="data-input" type="file" accept=".csv,.xlsx,.xls" hidden />
      </label>
      <label class="upload-btn" for="doc-input">
        <span>+ Upload PDF/DOCX/TXT</span>
        <input id="doc-input" type="file" accept=".txt,.md,.pdf,.docx" hidden />
      </label>
      <span id="upload-status"></span>
    </div>
    <p class="upload-note">
      A spreadsheet upload replaces any previously loaded data (questions answer from the new file only).
      A document upload adds to the existing knowledge base alongside what's already there.
    </p>

    <div id="log"></div>

    <form id="chat-form">
      <input id="question" type="text" placeholder="e.g. What is safety stock?" autocomplete="off" />
      <button type="submit">Ask</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const log = document.getElementById("log");
    const dataInput = document.getElementById("data-input");
    const docInput = document.getElementById("doc-input");
    const uploadStatus = document.getElementById("upload-status");

    function addEntry(role, text, chartDataUri) {
      const div = document.createElement("div");
      div.className = "entry " + role;
      div.textContent = text;
      if (chartDataUri) {
        const img = document.createElement("img");
        img.src = chartDataUri;
        img.className = "chart-image";
        div.appendChild(img);
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      addEntry("user", question);
      input.value = "";
      const thinking = addEntry("agent", "Thinking...");

      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      thinking.remove();

      if (data.error) {
        addEntry("agent", "Error: " + data.error);
        return;
      }
      let text = data.answer;
      if (data.sources && data.sources.length) {
        text += "\n\nSources: " + data.sources.join(", ");
      }
      addEntry("agent", text, data.chart);
    });

    async function uploadFile(file, endpoint, onSuccess) {
      uploadStatus.textContent = "Uploading " + file.name + "...";
      const formData = new FormData();
      formData.append("file", file);
      try {
        const res = await fetch(endpoint, { method: "POST", body: formData });
        const data = await res.json();
        uploadStatus.textContent = "";
        if (data.error) {
          addEntry("agent", "Couldn't load " + file.name + ": " + data.error);
          return;
        }
        onSuccess(data);
      } catch (err) {
        uploadStatus.textContent = "";
        addEntry("agent", "Upload failed: " + err);
      }
    }

    dataInput.addEventListener("change", () => {
      const file = dataInput.files[0];
      if (!file) return;
      uploadFile(file, "/api/upload-data", (data) => {
        for (const t of data.tables) {
          addEntry(
            "agent",
            "Loaded " + t.name + " — " + t.rows + " rows. Columns: " + t.columns.join(", ") +
            "\n\nYou can ask about this data now."
          );
        }
      });
      dataInput.value = "";
    });

    docInput.addEventListener("change", () => {
      const file = docInput.files[0];
      if (!file) return;
      uploadFile(file, "/api/upload-docs", (data) => {
        addEntry(
          "agent",
          "Added " + data.filename + " (" + data.chunks + " chunk" + (data.chunks === 1 ? "" : "s") +
          ") to the knowledge base.\n\nYou can ask about it now."
        );
      });
      docInput.value = "";
    });
  </script>
</body>
</html>
